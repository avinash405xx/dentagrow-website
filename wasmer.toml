# Wasmer package manifest for the DentaGrow landing page.
# Serves the Vite build output (dist/) using Wasmer's Static Web Server.
#
# Vite inlines VITE_* variables at BUILD time, so the Google Apps Script Web App
# URL must be present when `npm run build` runs (locally via .env.local, or on
# Wasmer via the build environment). The Static Web Server is a pure static
# file server, so no runtime env var is needed to serve the site.
[package]
name = "avinash405xx/dentagrow-landing"
version = "0.3.0"
description = "DentaGrow landing page - 14-Day DentaGrow Trial ($1)"

[dependencies]
"wasmer/static-web-server" = "1"

[fs]
public = "dist"
